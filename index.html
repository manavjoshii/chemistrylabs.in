    <!-- One typeface, self-hosted. font-family: Helvetica silently becomes

         arrive with the stylesheet. No webfont service is used at all. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
